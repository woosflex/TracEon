name: Query benchmark smoke check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev
    - name: Build query tools
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j4 --target traceon remote_bench
    - name: Check query measurements and payload accounting
      run: python3 tests/test_remote_profile.py build/traceon build/remote_bench
    # Hosted runners are not controlled performance hardware. Comparative
    # timings and regressions require the documented repeated-study protocol.
