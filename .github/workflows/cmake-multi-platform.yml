name: Create Release and Build Binaries

# This workflow runs when a new tag is pushed (e.g., v1.0.0, v1.0.1)
on:
  push:
    tags:
      - "v*"

# Add permissions for the GITHUB_TOKEN to create a release and write assets
permissions:
  contents: write

jobs:
  # This job creates the GitHub Release once.
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  # This job builds the binaries for each OS and architecture in parallel.
  build:
    name: Build on ${{ matrix.platform.os }} (${{ matrix.platform.arch }})
    needs: create_release # This job runs only after the release has been created.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, arch: "x86_64" }
          - { os: ubuntu-24.04-arm, arch: "arm64" }
          - { os: windows-latest, arch: "x86_64" }
          - { os: windows-11-arm, arch: "arm64" }
          - { os: macos-15-intel, arch: "x86_64" }
          - { os: macos-latest, arch: "arm64" }

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        # Force Release build type
        run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Driver
        # Explicitly target traceon_driver
        run: cmake --build ${{ github.workspace }}/build --config Release --target traceon_driver

      # --- Packaging for Windows ---
      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          # MSVC Release binaries are typically in /Release subdirectory
          Compress-Archive -Path ${{ github.workspace }}/build/Release/traceon_driver.exe -DestinationPath ${{ github.workspace }}/traceon-windows-${{ matrix.platform.arch }}.zip
        shell: pwsh

      # --- Packaging for Linux/macOS ---
      - name: Prepare Artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          # Unix binaries are typically in the build root
          tar -czvf ${{ github.workspace }}/traceon-${{ runner.os }}-${{ matrix.platform.arch }}.tar.gz -C ${{ github.workspace }}/build traceon_driver
        shell: bash

      # --- Upload Assets ---
      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/traceon-windows-${{ matrix.platform.arch }}.zip
          asset_name: traceon-windows-${{ matrix.platform.arch }}.zip
          asset_content_type: application/zip

      - name: Upload Release Asset (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/traceon-${{ runner.os }}-${{ matrix.platform.arch }}.tar.gz
          asset_name: traceon-${{ runner.os }}-${{ matrix.platform.arch }}.tar.gz
          asset_content_type: application/gzip

