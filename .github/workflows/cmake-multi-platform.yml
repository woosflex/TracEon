name: Build and verify release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.platform.os }} (${{ matrix.platform.arch }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, arch: "x86_64" }
          - { os: ubuntu-24.04-arm, arch: "arm64" }
          - { os: windows-latest, arch: "x86_64" }
          - { os: windows-11-arm, arch: "arm64" }
          - { os: macos-15-intel, arch: "x86_64" }
          - { os: macos-latest, arch: "arm64" }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_NATIVE_INSTRUCTIONS=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Build all default targets
        run: cmake --build build --config Release -j4
      - name: Test including installed consumer
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release --component TracEon --prefix package
      - name: Check packaging and archive manifests
        shell: bash
        run: python3 tests/test_package_release.py
      - name: Archive installed files and provenance
        shell: bash
        env:
          PACKAGE_OS: ${{ runner.os }}
          PACKAGE_ARCH: ${{ matrix.platform.arch }}
        run: python3 tools/package_release.py package artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: traceon-${{ runner.os }}-${{ matrix.platform.arch }}
          path: artifacts/*
          if-no-files-found: error

  draft_release:
    name: Attach verified packages to draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
