name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake with TSan
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

    - name: Build All Test Targets
      run: cmake --build build -j 4

    - name: Run Tests (TSan)
      working-directory: ./build  # This handles the 'cd build' for you
      run: |
        # The [oom] test applies setrlimit(RLIMIT_AS), which kills the TSan
        # allocator (FATAL: internal allocator is out of memory). It is a
        # documented sanitizer incompatibility — the test passes in the normal
        # suite. The suite is split into per-domain executables so each stays
        # small enough for sanitizer runtimes.
        ./unit_tests "~[oom]"
        ./kmer_tests "~[oom]"
        ./test_parser_fastq "~[oom]"
        ./test_parser_fasta "~[oom]"
        ./test_gzip "~[oom]"
        ./test_binary_cache "~[oom]"
        ./test_lifecycle "~[oom]"
        ./test_api_misc "~[oom]"